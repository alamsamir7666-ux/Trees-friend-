openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: |
    Tree Friend E-Commerce API.

    ## Versioning

    The API is mounted under two prefixes:
      - `/api/v1` — the canonical, versioned path. New clients should use this.
      - `/api`     — backward-compat alias for existing callers. Same handlers,
                     transparently aliased.

    When a v2 is needed, a new router will be mounted under `/api/v2` and
    `/api/v1` will be left untouched. The unversioned `/api` alias will be
    deprecated (Deprecation header + warning log) once all callers have
    migrated to `/api/v1`.
servers:
  - url: /api/v1
    description: Versioned API path (canonical)
  - url: /api
    description: Unversioned API path (backward-compat alias)
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product operations
  - name: categories
    description: Category operations
  - name: cart
    description: Cart operations
  - name: orders
    description: Order operations
  - name: reviews
    description: Review operations
  - name: wishlist
    description: Wishlist operations
  - name: coupons
    description: Coupon operations
  - name: users
    description: User operations
  - name: sellers
    description: Seller marketplace operations
  - name: sellerListings
    description: Seller listing marketplace operations (plan doc §10.2)
  - name: sellerOrders
    description: Seller order management + courier booking operations (plan doc §4, §8 — Part 4)
  - name: sellerPaymentConfigs
    description: Seller bKash payment settings CRUD (plan doc §4, §7 — Part 5)
  - name: platformPaymentConfig
    description: >-
      Admin-only platform bKash merchant config (new admin-custodial payments
      design, Part 1 of 4). The platform's single bKash merchant account —
      buyers pay into this, not into any per-seller account.
  - name: sellerPayoutAccounts
    description: >-
      Seller bKash payout number CRUD (new admin-custodial payments design,
      Part 1 of 4). Replaces the old per-seller merchant-credential model for
      NEW payouts — sellers register a plain account number to receive
      disbursements instead of holding merchant API credentials themselves.
  - name: bkashPayment
    description: >-
      bKash Tokenized Checkout create/execute/query cycle (Part 2 of 4). The
      buyer-facing create-payment routes here ARE part of this typed spec;
      /bkash/callback (bKash's own browser-redirect target after the buyer
      authorizes on bKash's hosted page) deliberately is NOT — same
      precedent as courierWebhooks, which also isn't in this spec.
  - name: conversations
    description: >-
      Buyer-seller messaging. One conversation per buyer-seller pair,
      messages within each conversation. Conversations are created
      implicitly when a buyer messages a seller (idempotent upsert).
      Supports cursor-based pagination for messages and read receipts.
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: Categories list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryBody"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    put:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryBody"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products with optional filters
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: minRating
          in: query
          schema:
            type: number
        - name: sortBy
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: homepageTag
          in: query
          description: Filters products by homepage placement tag (e.g. "trending", "new_arrivals").
          schema:
            type: string
      responses:
        "200":
          description: Products list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/featured:
    get:
      operationId: getFeaturedProducts
      tags: [products]
      summary: Get featured products for homepage
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/homepage:
    get:
      operationId: getHomepageProducts
      tags: [products]
      summary: Get top and bottom homepage section products
      responses:
        "200":
          description: Homepage section products
          content:
            application/json:
              schema:
                type: object
                required: [top, bottom]
                properties:
                  top:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                  bottom:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
    put:
      operationId: updateProduct
      tags: [products]
      summary: Update a product (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductBody"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get current user's cart
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    delete:
      operationId: clearCart
      tags: [cart]
      summary: Clear cart
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /cart/items:
    post:
      operationId: addToCart
      tags: [cart]
      summary: Add item to cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToCartBody"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /cart/items/{id}:
    put:
      operationId: updateCartItem
      tags: [cart]
      summary: Update cart item quantity
      description: >-
        id is the cart_items row's own primary key, not a variantId --
        a seller-listing cart line has no variantId, so the row id is the
        only identifier that addresses both line kinds (plan doc §2, §7;
        see schema/cart.ts doc comment).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemBody"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
    delete:
      operationId: removeFromCart
      tags: [cart]
      summary: Remove item from cart
      description: id is the cart_items row's own primary key, not a variantId.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List current user's orders
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place an order
      description: >-
        Always returns an array. A cart spanning multiple sellers splits
        into one order per seller (plus one for admin-direct lines, if
        any) -- plan doc §2, §7. A single-seller or all-admin-direct cart
        still returns an array, just with one element, so callers never
        need to branch on whether checkout split.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Created order(s)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/track/{trackingId}:
    get:
      operationId: trackOrder
      tags: [orders]
      summary: Track order by tracking ID (public)
      parameters:
        - name: trackingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order tracking info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderTracking"

  /reviews/{productId}/eligibility:
    get:
      operationId: getReviewEligibility
      tags: [reviews]
      summary: Check if current user can review this product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Eligibility result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEligibility"

  /reviews/{productId}:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: Get reviews for a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createReview
      tags: [reviews]
      summary: Create a review (auth required)
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "201":
          description: Created review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /reviews/{reviewId}:
    put:
      operationId: updateReview
      tags: [reviews]
      summary: Update own review
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "200":
          description: Updated review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /reviews/{productId}/{reviewId}:
    delete:
      operationId: deleteReview
      tags: [reviews]
      summary: Delete a review (admin or owner)
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /seller-listings/{sellerListingId}/reviews:
    get:
      operationId: listSellerListingReviews
      tags: [reviews]
      summary: Get reviews for a specific seller's listing
      parameters:
        - name: sellerListingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SellerListingReview"
    post:
      operationId: createSellerListingReview
      tags: [reviews]
      summary: Create a review for a specific seller listing VARIANT (auth required, must have purchased that exact variant)
      parameters:
        - name: sellerListingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSellerListingReviewBody"
      responses:
        "201":
          description: Created review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerListingReview"

  /seller-listings/{sellerListingId}/reviews/eligibility:
    get:
      operationId: getSellerListingReviewEligibility
      tags: [reviews]
      summary: Check if current user can review this exact seller-listing variant
      parameters:
        - name: sellerListingId
          in: path
          required: true
          schema:
            type: integer
        - name: variantId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Eligibility result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewEligibility"

  /admin/reviews:
    get:
      operationId: listAllReviews
      tags: [admin]
      summary: Admin — list all reviews with product info
      responses:
        "200":
          description: All reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminReview"

  /products/{productId}/qa:
    get:
      operationId: listProductQA
      tags: [qa]
      summary: Get published Q&A for a product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Q&A list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QAItem"
    post:
      operationId: createProductQuestion
      tags: [qa]
      summary: Ask a question about a product (auth required)
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionBody"
      responses:
        "201":
          description: Created question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QAItem"

  /seller-listings/{sellerListingId}/qa:
    get:
      operationId: listSellerListingQA
      tags: [qa]
      summary: Get published Q&A for a specific seller's listing
      parameters:
        - name: sellerListingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Q&A list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QAItem"
    post:
      operationId: createSellerListingQuestion
      tags: [qa]
      summary: Ask a question about a specific seller's listing (auth required)
      parameters:
        - name: sellerListingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionBody"
      responses:
        "201":
          description: Created question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QAItem"

  /seller/qa/{id}/answer:
    put:
      operationId: answerSellerListingQuestion
      tags: [qa]
      summary: Seller answers a question on their own listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerQuestionBody"
      responses:
        "200":
          description: Answered question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QAItem"

  /wishlist:
    get:
      operationId: getWishlist
      tags: [wishlist]
      summary: Get user's wishlist, split into product-variety rows and seller-listing rows
      responses:
        "200":
          description: Wishlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetWishlistResponse"

  /wishlist/{productId}:
    post:
      operationId: addToWishlist
      tags: [wishlist]
      summary: Add product (variety) to wishlist
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
    delete:
      operationId: removeFromWishlist
      tags: [wishlist]
      summary: Remove product (variety) from wishlist
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /wishlist/seller-listing-variant/{variantId}:
    post:
      operationId: addSellerListingVariantToWishlist
      tags: [wishlist]
      summary: Add a specific seller's listing variant to wishlist
      parameters:
        - name: variantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
    delete:
      operationId: removeSellerListingVariantFromWishlist
      tags: [wishlist]
      summary: Remove a specific seller's listing variant from wishlist
      parameters:
        - name: variantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /coupons/validate:
    post:
      operationId: validateCoupon
      tags: [coupons]
      summary: Validate a coupon code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateCouponBody"
      responses:
        "200":
          description: Coupon details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coupon"

  /coupons:
    get:
      operationId: listCoupons
      tags: [coupons]
      summary: List all coupons (admin only)
      responses:
        "200":
          description: Coupons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Coupon"
    post:
      operationId: createCoupon
      tags: [coupons]
      summary: Create a coupon (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCouponBody"
      responses:
        "201":
          description: Created coupon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coupon"

  /coupons/{id}:
    delete:
      operationId: deleteCoupon
      tags: [coupons]
      summary: Delete a coupon (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    put:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/me/addresses:
    get:
      operationId: listAddresses
      tags: [users]
      summary: Get user's saved addresses
      responses:
        "200":
          description: Addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Address"
    post:
      operationId: addAddress
      tags: [users]
      summary: Add a new address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressBody"
      responses:
        "201":
          description: Added address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"

  /users/me/addresses/{id}:
    put:
      operationId: updateAddress
      tags: [users]
      summary: Update an address
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressBody"
      responses:
        "200":
          description: Updated address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
    delete:
      operationId: deleteAddress
      tags: [users]
      summary: Delete an address
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /sellers/me:
    get:
      operationId: getMySeller
      tags: [sellers]
      summary: Get the current user's seller application/account, if any
      responses:
        "200":
          description: Seller record, or null if the user has never applied
