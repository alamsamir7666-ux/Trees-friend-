      operationId: updateShipmentStatus
      tags: [sellerOrders]
      summary: Seller — manually set shipment status (required for manual-fallback sellers, plan doc §8)
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShipmentStatusBody"
      responses:
        "200":
          description: Updated shipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderShipment"

  /seller/returns:
    get:
      operationId: listSellerReturns
      tags: [sellerReturns]
      summary: Seller — list return requests for their own orders, paginated
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [requested, approved, rejected, completed]
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Paginated list of the seller's return requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerReturnListResponse"

  /seller/returns/{id}:
    get:
      operationId: getSellerReturn
      tags: [sellerReturns]
      summary: Seller — get one return belonging to one of their own orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Return request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerReturn"

    put:
      operationId: updateSellerReturn
      tags: [sellerReturns]
      summary: Seller — approve, reject, or complete a return on one of their own orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSellerReturnBody"
      responses:
        "200":
          description: Updated return request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerReturn"

  /seller/monthly-history:
    get:
      operationId: getSellerMonthlyHistory
      tags: [sellerReturns]
      summary: Seller — monthly order count / delivered revenue history, computed live from their own orders
      parameters:
        - name: months
          in: query
          required: false
          description: How many most-recent months to return (default 12, max 60)
          schema:
            type: integer
      responses:
        "200":
          description: Monthly history records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerMonthlyHistoryResponse"

  /orders/{orderId}/shipment:
    get:
      operationId: getOrderShipment
      tags: [orders]
      summary: Buyer — get shipment/tracking status for one of their own orders. Reads only order_shipments, never calls the courier directly (plan doc §8).
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Shipment, or null if not booked/set yet
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OrderShipment"
                  - type: "null"

  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get admin dashboard analytics
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /admin/orders:
    get:
      operationId: listAllOrders
      tags: [admin]
      summary: List all orders (admin only)
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: All orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /admin/orders/{id}/status:
    put:
      operationId: updateOrderStatus
      tags: [admin]
      summary: Update order status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusBody"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /admin/orders/{id}/payment:
    put:
      operationId: updateOrderPayment
      tags: [admin]
      summary: Verify/update order payment status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePaymentStatusBody"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /admin/users:
    get:
      operationId: listAllUsers
      tags: [admin]
      summary: List all users (admin only)
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProfile"

  /admin/users/{id}/block:
    put:
      operationId: toggleUserBlock
      tags: [admin]
      summary: Block/unblock user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleBlockBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /admin/sellers:
    get:
      operationId: listSellers
      tags: [admin]
      summary: List seller applications/accounts (admin only), optionally filtered by status
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending_verification, active, suspended, vacation]
        - name: limit
          in: query
          required: false
          description: Page size (default 20, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          description: Number of records to skip for pagination (default 0)
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Sellers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Seller"

  /admin/sellers/counts:
    get:
      operationId: listSellerCounts
      tags: [admin]
      summary: Per-status seller counts (admin only), single request for all 4 tab badges
      responses:
        "200":
          description: Counts by status
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending_verification:
                    type: integer
                  active:
                    type: integer
                  suspended:
                    type: integer
                  vacation:
                    type: integer
                required:
                  - pending_verification
                  - active
                  - suspended
                  - vacation

  /admin/sellers/{id}/approve:
    put:
      operationId: approveSeller
      tags: [admin]
      summary: Approve a pending seller application (admin only) — sets status to active
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved seller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Seller"

  /admin/sellers/{id}/reject:
    put:
      operationId: rejectSeller
      tags: [admin]
      summary: Reject a pending seller application (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectSellerBody"
      responses:
        "200":
          description: Rejected seller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Seller"

  /admin/sellers/{id}/suspend:
    put:
      operationId: suspendSeller
      tags: [admin]
      summary: Suspend an active seller (admin only) — hides their listings without deleting them
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Suspended seller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Seller"

  /admin/seller-verification-requests:
    get:
      operationId: listSellerVerificationRequests
      tags: [admin]
      summary: >-
        List sellers by verification badge request status (admin only).
        Defaults to "requested" (the review queue); pass status to see
        none/approved/rejected instead.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [none, requested, approved, rejected]
      responses:
        "200":
          description: Sellers matching the given verification request status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Seller"

  /admin/sellers/{id}/verify:
    put:
      operationId: verifySeller
      tags: [admin]
      summary: >-
        Approve a seller's pending "verified seller" badge request (admin
        only, manual review). Only valid from verificationRequestStatus =
        "requested".
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Seller with isVerified=true, verificationRequestStatus="approved"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Seller"

  /admin/sellers/{id}/reject-verification:
    put:
      operationId: rejectSellerVerification
      tags: [admin]
      summary: >-
        Reject a seller's pending "verified seller" badge request (admin
        only). Does not suspend or delete the seller -- only the badge
        request is declined.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Seller with verificationRequestStatus="rejected"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Seller"

  /admin/seller-payment-configs:
    get:
      operationId: listAdminSellerPaymentConfigs
      tags: [admin]
      summary: >-
        List seller bKash payment configs for admin review (admin only).
        Defaults to unverified/pending-review configs; pass verified=true
        to see already-verified ones instead.
      parameters:
        - name: verified
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Payment configs (masked)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SellerPaymentConfig"

  /admin/seller-payment-configs/{id}/verify:
    put:
      operationId: verifySellerPaymentConfig
      tags: [admin]
      summary: >-
        Mark a seller's bKash payment config as verified (admin only,
        manual review — no live bKash API check). Unlocks
        "advance"/"both"/"bkash" for that seller.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Verified payment config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerPaymentConfig"

  /admin/seller-payment-configs/{id}/unverify:
    put:
      operationId: unverifySellerPaymentConfig
      tags: [admin]
      summary: Revoke verification on a seller's bKash payment config (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unverified payment config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerPaymentConfig"

  /admin/seller-courier-configs:
    get:
      operationId: listAdminSellerCourierConfigs
      tags: [admin]
      summary: >-
        List seller Pathao/Steadfast courier configs for admin review
        (admin only). Defaults to unverified/pending-review configs; pass
        verified=true to see already-verified ones instead.
      parameters:
        - name: verified
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Courier configs (masked)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SellerCourierConfig"

  /admin/seller-courier-configs/{id}/verify:
    put:
      operationId: verifySellerCourierConfig
      tags: [admin]
      summary: >-
        Mark a seller's courier config as verified (admin only, manual
        review — no live Pathao/Steadfast API check).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Verified courier config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerCourierConfig"

  /admin/seller-courier-configs/{id}/unverify:
    put:
      operationId: unverifySellerCourierConfig
      tags: [admin]
      summary: Revoke verification on a seller's courier config (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unverified courier config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerCourierConfig"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        icon:
          type: ["string", "null"]
        displayOrder:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - slug
        - icon
        - displayOrder
        - createdAt
        - updatedAt

    CreateCategoryBody:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        icon:
          type: ["string", "null"]
        displayOrder:
          type: integer
      required:
        - name

    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        categoryId:
          type: integer
        scientificName:
          type: ["string", "null"]
        description:
          type: string
        sunlight:
          type: ["string", "null"]
        watering:
          type: ["string", "null"]
        soilType:
          type: ["string", "null"]
        matureHeight:
          type: ["string", "null"]
        climateZone:
          type: ["string", "null"]
        growthRate:
          type: ["string", "null"]
        bloomSeason:
          type: ["string", "null"]
        keyBenefits:
          type: array
          items:
            type: string
        bestFor:
          type: array
          items:
            type: string
        careTips:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            type: string
        videoUrl:
          type: ["string", "null"]
        homepageTag:
          type: ["string", "null"]
        productStatus:
          type: string
        startingPrice:
          type: ["number", "null"]
        totalStock:
          type: integer
        inStock:
          type: boolean
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ProductVariant"
        listingMinPrice:
          type: ["number", "null"]
        listingMaxPrice:
          type: ["number", "null"]
        listingCount:
          type: integer
        averageRating:
          type: number
        reviewCount:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - name
        - slug
        - categoryId
        - description
        - keyBenefits
        - bestFor
        - careTips
        - images
        - productStatus
        - startingPrice
        - totalStock
        - inStock
        - variants
        - listingMinPrice
        - listingMaxPrice
        - listingCount
        - averageRating
        - reviewCount
        - createdAt

    ProductListResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
      required:
        - products
        - total
        - page
        - totalPages

    ProductVariant:
      type: object
      properties:
        id:
          type: integer
        productId:
          type: integer
        name:
          type: string
        variantType:
          type: string
        form:
          type: ["string", "null"]
        price:
          type: number
        discountPrice:
          type: ["number", "null"]
        stock:
          type: integer
        deliveryCharge:
          type: number
        sku:
          type: ["string", "null"]
      required:
        - id
        - productId
        - name
        - variantType
        - price
        - stock
        - deliveryCharge

    ProductVariantInput:
      type: object
      properties:
        name:
          type: string
        variantType:
          type: string
        form:
          type: ["string", "null"]
        price:
          type: number
        discountPrice:
          type: ["number", "null"]
        stock:
          type: integer
        deliveryCharge:
          type: number
        sku:
          type: ["string", "null"]
      required:
        - name
        - price

    CreateProductBody:
      type: object
      properties:
        name:
          type: string
        categoryId:
          type: integer
        scientificName:
          type: ["string", "null"]
        description:
          type: string
        sunlight:
          type: ["string", "null"]
        watering:
          type: ["string", "null"]
        soilType:
          type: ["string", "null"]
        matureHeight:
          type: ["string", "null"]
        climateZone:
          type: ["string", "null"]
        growthRate:
          type: ["string", "null"]
        bloomSeason:
          type: ["string", "null"]
        homepageTag:
          type: ["string", "null"]
        keyBenefits:
          type: array
          items:
            type: string
        bestFor:
          type: array
          items:
            type: string
        careTips:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            type: string
        videoUrl:
          type: string
        productStatus:
          type: string
        variants:
          type: array
          description: >-
            Deprecated / ignored as of Phase 2: admin no longer creates
            variant data. If present, this field is silently ignored by
            POST /products -- it is not read or persisted. Kept in the
            spec (rather than removed) only because the route accepts and
            discards it instead of rejecting it; do not rely on it.
          items:
            $ref: "#/components/schemas/ProductVariantInput"
      required:
        - name
        - categoryId
        - description
        - images

    UpdateProductBody:
      type: object
      properties:
        name:
          type: string
        categoryId:
          type: integer
        scientificName:
          type: ["string", "null"]
        description:
          type: string
        sunlight:
          type: ["string", "null"]
        watering:
          type: ["string", "null"]
        soilType:
          type: ["string", "null"]
        matureHeight:
          type: ["string", "null"]
        climateZone:
          type: ["string", "null"]
        growthRate:
          type: ["string", "null"]
        bloomSeason:
          type: ["string", "null"]
        homepageTag:
          type: ["string", "null"]
        keyBenefits:
          type: array
          items:
            type: string
        bestFor:
          type: array
          items:
            type: string
        careTips:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            type: string
        videoUrl:
          type: string
        productStatus:
          type: string
        variants:
          type: array
          description: >-
            Deprecated / ignored as of Phase 2: admin no longer edits
            variant data. If present, this field is silently ignored by
            PUT /products/:id -- it is not read or persisted.
          items:
            $ref: "#/components/schemas/ProductVariantInput"

    CartItemProduct:
      type: object
      description: Trimmed product info attached to a cart line (not the full Product shape).
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        categoryId:
          type: integer
        description:
          type: string
        images:
          type: array
          items:
            type: string
        averageRating:
          type: number
        reviewCount:
          type: integer
        isFeatured:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - name
        - slug
        - categoryId
        - description
        - images
        - averageRating
        - reviewCount
        - createdAt

    CartItemSeller:
      type: object
      description: Present only on seller_listing-kind cart lines.
      properties:
        id:
          type: integer
        businessName:
          type: string
        nurseryName:
          type: string
        location:
          type: string
        hasVerifiedPaymentConfig:
          type: boolean
          description: >-
            True only if this seller has a seller_payment_configs row with
            isVerified = true. Reflects the seller's live config state, which
            can drift from the listing's own paymentMethod field (e.g. after
            an admin unverifies a seller without touching their listings).
            Checkout uses this, not listing.paymentMethod alone, to decide
            whether bKash can actually be offered for this line.
      required:
        - id
        - businessName
        - nurseryName
        - location
        - hasVerifiedPaymentConfig

    CartItemListing:
      type: object
      description: Present only on seller_listing-kind cart lines.
      properties:
        id:
          type: integer
        form:
          type: ["string", "null"]
        rootType:
          type: ["string", "null"]
        potSize:
          type: ["string", "null"]
        age:
          type: ["string", "null"]
        height:
          type: ["string", "null"]
        condition:
          type: ["string", "null"]
        price:
          type: number
        discountPrice:
          type: ["number", "null"]
        stock:
          type: integer
        availableQuantity:
          type: integer
        deliveryTimeDays:
          type: ["integer", "null"]
        deliveryCharge:
          type: number
        paymentMethod:
          type: string
      required:
        - id
        - price
        - stock
        - availableQuantity
        - deliveryCharge
        - paymentMethod

    CartItem:
      type: object
      description: >-
        A cart line is EITHER kind "variant" (admin-direct, variant +
        variantId populated) OR kind "seller_listing" (marketplace,
        sellerListingId/sellerId/seller/listing populated) -- never both.
        See schema/cart.ts doc comment for the full rationale.
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [variant, seller_listing]
        productId:
          type: integer
        variantId:
          type: ["integer", "null"]
        sellerListingId:
          type: ["integer", "null"]
        sellerId:
          type: ["integer", "null"]
        quantity:
          type: integer
        variant:
          oneOf:
            - $ref: "#/components/schemas/ProductVariant"
            - type: "null"
        seller:
          oneOf:
            - $ref: "#/components/schemas/CartItemSeller"
            - type: "null"
        listing:
          $ref: "#/components/schemas/CartItemListing"
        product:
          $ref: "#/components/schemas/CartItemProduct"
      required:
        - id
        - kind
        - productId
        - variantId
        - sellerListingId
        - sellerId
        - quantity
        - product

    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal:
          type: number
        discount:
          type: number
        deliveryTotal:
          type: number
        total:
          type: number
      required:
        - items
        - subtotal
        - discount
        - deliveryTotal
        - total

    AddToCartBody:
      type: object
      description: >-
        Specify exactly one of variantId (admin-direct product variant) or
        sellerListingVariantId (marketplace seller listing variant), never
        both, never neither -- confirmed against cart.ts's POST /cart/items
        handler, which rejects the request with 400 if hasVariant ===
        hasListingVariant. sellerListingId is still accepted in the request
        body for backward compat with older clients, but is IGNORED for
        line-creation purposes -- the route derives sellerListingId itself
        from sellerListingVariantId's own FK rather than trusting a
        client-sent value.
      properties:
        productId:
          type: integer
        variantId:
          type: integer
          nullable: true
        sellerListingId:
          type: integer
          nullable: true
          description: Deprecated/ignored -- see description above. Prefer sellerListingVariantId.
        sellerListingVariantId:
          type: integer
          nullable: true
        quantity:
          type: integer
      required:
        - productId
        - quantity

    UpdateCartItemBody:
      type: object
      properties:
        quantity:
          type: integer
      required:
        - quantity

    OrderLineItem:
