      type: object
      properties:
        buyerConversations:
          type: array
          items:
            $ref: "#/components/schemas/ConversationListItem"
        sellerConversations:
          type: array
          items:
            $ref: "#/components/schemas/ConversationListItem"
      required:
        - buyerConversations
        - sellerConversations

    Message:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        senderId:
          type: string
        content:
          type: string
        messageType:
          type: string
        imageUrl:
          type: ["string", "null"]
        readByBuyer:
          type: boolean
        readBySeller:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - conversationId
        - senderId
        - content
        - messageType
        - readByBuyer
        - readBySeller
        - createdAt

    MessageList:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        hasMore:
          type: boolean
        nextCursor:
          type: ["integer", "null"]
      required:
        - messages
        - hasMore

    SendMessageBody:
      type: object
      properties:
        content:
          type: string
        messageType:
          type: string
          default: text
        imageUrl:
          type: string
      required:
        - content
