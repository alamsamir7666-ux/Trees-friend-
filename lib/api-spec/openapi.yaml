        line) or sellerListingId+sellerId are set (marketplace line) --
        never both. Every line on a given order has the same kind and, for
        marketplace orders, the same sellerId as the order itself.
      properties:
        productId:
          type: integer
        productName:
          type: string
        productImage:
          type: string
        variantId:
          type: integer
        variantName:
          type: string
        sellerListingId:
          type: integer
        sellerId:
          type: integer
        quantity:
          type: integer
        price:
